# Application Configuration
pipeline_type: "xgb"
window: 96
horizon: 96
stride: 1
prediction_target: "cpu_util_instance"
STANDARD_METRICS:
  - "cpu_util_instance"
  - "mean_cpu_util_prct"
  - "cpu_slo_upper"
  - "cpu_slo_lower"
cols_to_drop: ["ts"]
splits:
  [0.7, 0.1, 0.2]
parquet_path: "data/orchestrator_data/data.parquet"
gmlp:
  model_params:
    d_model: 64
    d_ffn: 128
    depth: 2
    patch_size: 1
    epochs: 10
    lr: 0.001
    patience: 10
xgb:
  model_params:
    n_estimators: 100
    max_depth: 4
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 3
    gamma: 0.1
    reg_lambda: 1.0
    reg_alpha: 0.0
    tree_method: "hist"
    predictor: "cpu_predictor"
    random_state: 42
    n_jobs: -1
    objective: "reg:squarederror"
retrain_frequency: "30m"